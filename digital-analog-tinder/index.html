  <head>
    <title>Digital-Analog Tinder</title>
    <link
      rel="stylesheet"
      href="https://code.jquery.com/mobile/1.4.4/jquery.mobile-1.4.4.min.css"
    />
    <link rel="stylesheet" href="css/digital-analog.css" />

    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.4/jquery.mobile-1.4.4.min.js"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="indicator indicator-left">digital</div>
    <div id="container">
      <div
        class="card"
        style="display: block"
        data-sol="analog"
        data-note-wrong="Sadly not. The cassette uses the degree of magnetization of a tape to encode data."
        data-note-correct="Correct, the cassette uses the degree of magnetization of a tape to encode data."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/kassette.jpg)"
        >
          <div class="description">Cassette Tape</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="digital"
        data-note-wrong="Sadly not. Correct, data on CDs is digitally encoded: The grooves in the CD form a digital code."
        data-note-correct="Correct, data on CDs is digitally encoded: The grooves in the CD form a digital code."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/CD.jpg)"
        >
          <div class="description">CD</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="digital"
        data-note-wrong="Sadly not. The Abacus is an ancient calculating device that represents numbers using the threaded beads."
        data-note-correct="Correct, the Abacus is an ancient calculating device that represents numbers using the threaded beads."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/abakus.jpg)"
        >
          <div class="description">Abacus</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="analog"
        data-note-wrong="Sadly not. A watch, as shown in the image, shows the time on a continuous scale."
        data-note-correct="Correct, a watch, as shown in the image, shows the time on a continuous scale."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/Taschenuhr.jpg)"
        >
          <div class="description">Watch</div>
        </div>
      </div>

      <div
        class="card"
        data-sol="digital"
        data-note-wrong="Sadly not. The printed font uses a finite character set."
        data-note-correct="Correct, the printed font uses a finite character set."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/druckschrift.jpg)"
        >
          <div class="description">Printed Text</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="analog"
        data-note-wrong="Sadly not. Every form is possible with handwriting, so the data is continuous."
        data-note-correct="Correct, every form is possible with handwriting, so the data is continuous."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/handschrift.jpg)"
        >
          <div class="description">Handwritten Text</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="digital"
        data-note-wrong="Sadly not. Digital clocks have only a finite character set to represent the time."
        data-note-correct="Correct, digital clocks have only a finite character set to represent the time."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/digitaluhr-2.jpg)"
        >
          <div class="description">Digital Clock</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="analog"
        data-note-wrong="We would say not. The exposure of the film leads to a chemical reaction of the image material."
        data-note-correct="Correct, the exposure of the film leads to a chemical reaction of the image material."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/SWPhoto.jpg)"
        >
          <div class="description">Photo from the 30s</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="analog"
        data-note-wrong="Sadly not. The data is transmitted as an electromagnetic wave and then converted into sound."
        data-note-correct="Correct, the data is transmitted as an electromagnetic wave and then converted into sound."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/Radio.jpg)"
        >
          <div class="description">Radio</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="analog"
        data-note-wrong="Sadly not. The gramophone reads the data from records, whose grooves reproduce the sound wave of the stored signal."
        data-note-correct="Correct, the gramophone reads the data from records, whose grooves reproduce the sound wave of the stored signal."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/Grammophon.jpg)"
        >
          <div class="description">Gramophone</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="digital"
        data-note-wrong="Sadly not. Are natural numbers really continuous?"
        data-note-correct="Correct, natural numbers are not continuous."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/Zahlen.jpg)"
        >
          <div
            class="description"
            style="color: black; text-shadow: 0 1px 0 #333333"
          >
            Natural Numbers
          </div>
        </div>
      </div>
      <div
        class="card"
        data-sol="digital"
        data-note-wrong="Sadly not. Typewriters have a finite character set."
        data-note-correct="Correct, typewriters have a finite character set."
      >
        <div
          class="icon"
          style="
            display: block;
            background-image: url(media/schreibmaschine.jpg);
          "
        >
          <div class="description">Typewriter</div>
        </div>
      </div>
      <div
        class="card"
        data-sol="digital"
        data-note-wrong="Sadly not. The computer uses a digital medium. It stores everything, whether image, video or music album with only two states: power on, power off."
        data-note-correct="Correct, the computer uses a digital medium. It stores everything, whether image, video or music album with only two states: power on, power off."
      >
        <div
          class="icon"
          style="display: block; background-image: url(media/PC.jpg)"
        >
          <div class="description">PC</div>
        </div>
      </div>
    </div>
    <div class="indicator indicator-right">analog</div>

    <div class="result">
      <div><i class="material-icons">done </i> <span id="correct">0</span></div>
      <div>
        <i class="material-icons">clear</i> <span id="incorrect">0</span>
      </div>
    </div>

    <div class="speech-bubble-container">
      <div class="speech-bubble">text</div>
    </div>

    <script src="js/swipe.js"></script>
  </body>
</html>
